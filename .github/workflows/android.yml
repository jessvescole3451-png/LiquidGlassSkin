name: Build Liquid Glass APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find project root
        id: find_root
        run: |
          SETTINGS=$(find . -name "settings.gradle" | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle"
            find . -type f | head -30
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Encontrado en: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install build tools
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Install Gradle and generate wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          cd ${{ steps.find_root.outputs.project_dir }}
          /opt/gradle/gradle-8.4/bin/gradle wrapper --gradle-version 8.4
          chmod +x ./gradlew

      - name: Build Release APK
        run: |
          cd ${{ steps.find_root.outputs.project_dir }}
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlass-Poweramp-Skin
          path: "**/app/build/outputs/apk/release/*.apk"
          retention-days: 30
